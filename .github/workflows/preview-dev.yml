name: Deploy dev preview

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-checkout

      - name: Copy preview files
        run: |
          mkdir -p main-checkout/dev/data
          cp index.html main-checkout/dev/index.html
          cp data/master.csv main-checkout/dev/data/master.csv

      - name: Commit and push to main
        run: |
          cd main-checkout
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dev/
          git diff --staged --quiet && echo "No changes to deploy" && exit 0
          git commit -m "chore: update dev preview [skip ci]"
          git push origin main
